<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>LIFE//LEVEL — Ngoại tuyến</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#edf4ff;font:16px/1.6 system-ui,sans-serif}main{max-width:640px;padding:32px}h1{font-size:36px;letter-spacing:-1px}b{color:#32e6f4}p{color:#9aaac3}a{display:inline-block;padding:12px 20px;background:#32e6f4;color:#080d18;border-radius:8px;text-decoration:none;font-weight:700}article{margin:24px 0;padding:20px;border:1px solid #28354b;border-radius:12px}li{margin:8px 0}.muted{font-size:13px}button{font:inherit;background:transparent;border:1px solid #3a4a60;color:#edf4ff;border-radius:8px;padding:8px;cursor:pointer}</style></head><body><main><b>LIFE//LEVEL</b><h1>Haven đang ngoại tuyến.</h1><p>Kết nối lại để tiếp tục hành trình. Bản xem dưới đây chỉ đọc, không trao thưởng hay đồng bộ hành động ngoại tuyến.</p><article id="snapshot"><p>Chưa có bản xem cuộc sống được lưu trên thiết bị.</p></article><a href="/">Kết nối lại</a><p class="muted">Tài chính và dữ liệu AI không được lưu trong bộ nhớ đệm của ứng dụng.</p><button id="clear">Xóa bản xem trên thiết bị này</button></main><script>const box=document.getElementById('snapshot');try{const raw=localStorage.getItem('lifelevel-snapshot');const saved=raw?JSON.parse(raw):null;const state=saved?.state||saved;if(state?.character&&Array.isArray(state.tasks)){box.replaceChildren();const title=document.createElement('h2');title.textContent=state.character.name+' · bản xem gần nhất';box.appendChild(title);const caption=document.createElement('p');caption.textContent='Nhiệm vụ đã lưu trên thiết bị; trạng thái có thể chưa cập nhật.';box.appendChild(caption);const list=document.createElement('ul');state.tasks.filter(t=>!t.archived).slice(0,10).forEach(task=>{const item=document.createElement('li');item.textContent=String(task.title);list.appendChild(item)});box.appendChild(list)}}catch{}document.getElementById('clear').onclick=()=>{localStorage.removeItem('lifelevel-snapshot');box.textContent='Đã xóa bản xem trên thiết bị.'};</script></body></html>
